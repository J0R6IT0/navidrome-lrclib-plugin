name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - name: Build
        run: cargo build --release --target wasm32-wasip1

      - name: Prepare bundle
        run: |
          mkdir bundle

          cp manifest.json bundle/

          cp target/wasm32-wasip1/release/*.wasm bundle/plugin.wasm

      - name: Create .ndp package
        run: |
          cd bundle
          zip -r ../plugin.ndp .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: plugin.ndp

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin.ndp
