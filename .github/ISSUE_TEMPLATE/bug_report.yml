name: Bug Report
description: Report a problem with the plugin
labels: ["bug"]
body:
  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please confirm the following before submitting your bug report.
      options:
        - label: I am running the latest Navidrome release (check via the "About" menu in Navidrome)
          required: true
        - label: The plugin is enabled in Navidrome's plugin settings
          required: true
        - label: The plugin is set in the `LyricsPriority` config option (nd-lyrics)
          required: true
        - label: I have searched existing issues and this hasn't been reported before
          required: true

  - type: input
    id: navidrome-version
    attributes:
      label: Navidrome version
      placeholder: e.g. 0.63.2
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: e.g. 8.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: false

  - type: textarea
    id: config
    attributes:
      label: Plugin configuration
      description: Attach one or more screenshots of your plugin config screen in Navidrome (redact anything sensitive).
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Navidrome logs related to the plugin, if available.
      render: shell
    validations:
      required: false
